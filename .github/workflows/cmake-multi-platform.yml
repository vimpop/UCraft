# CMake CI across multiple platforms + upload only the binary + release on tag
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Needed so we can create releases
permissions:
  contents: write

env:
  APP_NAME: UCraft

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${{ env.APP_NAME }}-${{ runner.os }}-${{ matrix.c_compiler }}" >> "$GITHUB_OUTPUT"
          echo "staging-dir=${{ github.workspace }}/build/out" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DUCRAFT_TCP_TESTS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --no-tests=error --output-junit test-results.xml

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}-${{ matrix.c_compiler }}
          path: |
            build/test-results.xml
            build/Testing/Temporary/*.log
            build/tests/server-smoke.log
          if-no-files-found: warn
          retention-days: 7

      # --- Collect just the binary and rename it per platform/compiler ---
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "${{ steps.strings.outputs.build-output-dir }}\src\Release"
          $outDir   = "${{ steps.strings.outputs.staging-dir }}"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exe = Join-Path $buildDir "UCraft.exe"
          if (-not (Test-Path $exe)) { throw "UCraft.exe not found in $buildDir" }
          $dest = Join-Path $outDir "${{ steps.strings.outputs.artifact-name }}.exe"
          Copy-Item $exe $dest -Force
          Write-Host "Staged UCraft.exe -> $dest"
      - name: Stage binary (Linux & macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="${{ steps.strings.outputs.build-output-dir }}/src"
          out_dir="${{ steps.strings.outputs.staging-dir }}"
          mkdir -p "$out_dir"
          bin_path="$build_dir/UCraft"
          test -x "$bin_path"
          dest="${out_dir}/${{ steps.strings.outputs.artifact-name }}"
          cp -f "$bin_path" "$dest"
          chmod +x "$dest"
          echo "Staged $(basename "$bin_path") -> $dest"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.strings.outputs.artifact-name }}
          path: ${{ steps.strings.outputs.staging-dir }}/*
          if-no-files-found: error
          retention-days: 7

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure with sanitizers
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DUCRAFT_TCP_TESTS=ON -DUCRAFT_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-Linux-sanitizers
          path: |
            build/test-results.xml
            build/Testing/Temporary/*.log
            build/tests/server-smoke.log
          if-no-files-found: warn
          retention-days: 7

  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy llvm
      - name: Configure coverage
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DUCRAFT_TCP_TESTS=ON -DUCRAFT_COVERAGE=ON
      - name: Analyze production sources
        run: python3 tests/analyze.py --build build
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Report coverage
        if: always()
        run: python3 tests/coverage.py --build build
      - name: Upload source audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-Linux
          path: |
            build/analysis/
            build/coverage/
            build/test-results.xml
            build/Testing/Temporary/*.log
            build/tests/server-smoke.log
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, sanitizers, source-audit]
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: UCraft-*
          merge-multiple: true

      - name: List downloaded files (debug)
        run: ls -la dist

      - name: Generate checksums
        run: |
          cd dist
          find . -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt
          cd -

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
